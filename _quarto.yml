profile:
  default: en

project:
  type: website
  output-dir: docs
  resources:
    - robots.txt
    - "images/**"
    - "assets/**"
    - "!es/**"

website:
  title: "Guillermo Fandos"
  site-url: https://www.gfandos.com
  favicon: images/favicon.png
  image: images/hero.jpg

  # SEO
  open-graph: true
  twitter-card:
    creator: "@g_fandos"
    site: "@g_fandos"
    image: images/hero.jpg
  repo-url: https://github.com/guifandos/gfandos-website

  sidebar: false

format:
  html:
    theme:
      light: [flatly, styles/custom.scss]
    toc: false
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <meta name="theme-color" content="#f7f3ea">
        <script>
        // Language switch: point the ES/EN navbar link to the same page in the other language
        document.addEventListener("DOMContentLoaded", function () {
          var links = document.querySelectorAll(".navbar a.nav-link");
          var path = location.pathname.replace(/index\.html$/, "");
          var isEs = /^\/es(\/|$)/.test(path);
          links.forEach(function (a) {
            var t = a.textContent.trim();
            if (t !== "ES" && t !== "EN") return;
            var target = isEs ? path.replace(/^\/es/, "") || "/" : "/es" + path;
            a.href = target; a.classList.add("lang-switch");
            var alt = document.createElement("link"); alt.rel = "alternate"; alt.hreflang = isEs ? "en" : "es"; alt.href = target;
            document.head.appendChild(alt);
          });
        });
        </script>
    grid:
      body-width: 860px
      margin-width: 220px

lang: en

project:
  type: website
  output-dir: docs
  resources:
    - robots.txt
    - fonts/          # self-hosted web fonts (fonts/fonts.css declares them)
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!AUDIT-REPORT.md"
    - "!ACTION-PLAN.md"

website:
  title: "Guillermo Fandos"
  description: "Spatial ecologist & conservation scientist | Assistant Professor at Universidad Complutense de Madrid"
  site-url: https://www.gfandos.com
  favicon: images/favicon.png

  # SEO
  open-graph: true
  twitter-card:
    creator: "@g_fandos"
    site: "@g_fandos"
  repo-url: https://github.com/guifandos/gfandos-website

  # Navigation
  navbar:
    # colours come from styles/lattice.scss ($navbar-bg / $navbar-fg)
    # TODO: add a logo file (navbar: logo:) or leave the wordmark as is
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        menu:
          - text: "Overview"
            href: research/index.qmd
          - text: "---"
          - text: "Movement & Dispersal"
            href: research/dispersal.qmd
          - text: "Monitoring & Modelling"
            href: research/forecasting.qmd
          - text: "Conservation & Global Change"
            href: research/conservation.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "People"
        href: people.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Outreach"
        href: outreach.qmd
    right:
      - icon: github
        href: https://github.com/guifandos
        aria-label: GitHub
      - icon: twitter
        href: https://twitter.com/g_fandos
        aria-label: Twitter / X
      - icon: mortarboard-fill
        href: https://scholar.google.es/citations?user=8zRbuNgAAAAJ
        aria-label: Google Scholar
      - icon: person-badge
        href: https://orcid.org/0000-0003-1579-9444
        aria-label: ORCID
      - icon: envelope
        href: mailto:gfandos@ucm.es
        aria-label: Email

  # Footer
  # Footer: three columns — address · elsewhere · fine print (brief §5).
  # The UCM logo file (images/logos/ucm.svg) is a PNG with an .svg extension
  # and did not render; it is left out rather than re-encoded.
  page-footer:
    left: |
      **Guillermo Fandos**\
      Dept. Biodiversidad, Ecología y Evolución\
      Facultad de Ciencias Biológicas, Universidad Complutense de Madrid\
      C/ José Antonio Novais 12, 28040 Madrid, Spain\
      [gfandos@ucm.es](mailto:gfandos@ucm.es)
    center: |
      **Elsewhere**\
      [Google Scholar](https://scholar.google.es/citations?user=8zRbuNgAAAAJ)\
      [ORCID 0000-0003-1579-9444](https://orcid.org/0000-0003-1579-9444)\
      [GitHub](https://github.com/guifandos) · [Zenodo](https://zenodo.org/search?q=fandos)\
      [UCM profile](https://produccioncientifica.ucm.es/investigadores/446092/detalle)
    right: |
      Open science: code and data for papers on GitHub, archived on Zenodo.

      © 2026 Guillermo Fandos · Made with [Quarto](https://quarto.org/)

  sidebar: false

format:
  html:
    # One base theme plus one SCSS file (brief §2). Fonts are self-hosted in
    # fonts/ and declared in fonts/fonts.css; listing it under `css` lets Quarto
    # resolve the path from every page depth (an include-in-header snippet
    # cannot, because its paths are inserted verbatim).
    theme: [default, styles/lattice.scss]
    css: fonts/fonts.css
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    smooth-scroll: false   # native CSS scroll-behavior in styles/lattice.scss instead (respects prefers-reduced-motion)
    link-external-newwindow: true
    fig-responsive: true
    lang: en

lang: en

project:
  type: website
  output-dir: docs
  resources:
    - robots.txt
    - "images/**"
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!AUDIT-REPORT.md"
    - "!ACTION-PLAN.md"
    - "!REDESIGN-PLAN.md"

website:
  title: "Guillermo Fandos"
  description: "Spatial ecology, animal movement and conservation. Research group led by Guillermo Fandos at Universidad Complutense de Madrid."
  site-url: https://www.gfandos.com
  favicon: images/favicon.png
  image: images/hero.jpg

  # SEO
  open-graph: true
  twitter-card:
    creator: "@g_fandos"
    site: "@g_fandos"
    image: images/hero.jpg
  repo-url: https://github.com/guifandos/gfandos-website

  # Navigation
  navbar:
    background: light
    left:
      - text: "Research"
        menu:
          - text: "Overview"
            href: research/index.qmd
          - text: "---"
          - text: "Movement & Dispersal"
            href: research/dispersal.qmd
          - text: "Monitoring & Modelling"
            href: research/forecasting.qmd
          - text: "Conservation & Global Change"
            href: research/conservation.qmd
          - text: "Field Technology"
            href: research/fieldtech.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "People"
        href: people.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "News"
        href: news/index.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: github
        href: https://github.com/guifandos
        aria-label: GitHub
      - icon: twitter-x
        href: https://x.com/g_fandos
        aria-label: X (Twitter)
      - icon: mortarboard-fill
        href: https://scholar.google.es/citations?user=8zRbuNgAAAAJ
        aria-label: Google Scholar
      - icon: person-badge
        href: https://orcid.org/0000-0003-1579-9444
        aria-label: ORCID
      - icon: envelope
        href: mailto:gfandos@ucm.es
        aria-label: Email

  # Footer
  page-footer:
    left: |
      **Guillermo Fandos** · Dept. Biodiversidad, Ecología y Evolución · Universidad Complutense de Madrid
    center: |
      [UCM Profile](https://produccioncientifica.ucm.es/investigadores/446092/detalle) · [Google Scholar](https://scholar.google.es/citations?user=8zRbuNgAAAAJ) · [ORCID](https://orcid.org/0000-0003-1579-9444) · [GitHub](https://github.com/guifandos)
    right: |
      © 2026 · Made with [Quarto](https://quarto.org/)

  sidebar: false

format:
  html:
    theme:
      light: [flatly, styles/custom.scss]
    toc: false
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <meta name="theme-color" content="#f7f3ea">
    grid:
      body-width: 860px
      margin-width: 220px

lang: en

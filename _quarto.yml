profile:
  default: en

project:
  type: website
  output-dir: docs
  resources:
    - robots.txt
    - "images/**"
    - "assets/**"
    - "!es/**"

website:
  title: "Guillermo Fandos"
  site-url: https://www.gfandos.com
  favicon: images/favicon.png
  image: images/hero.jpg

  # SEO
  open-graph: true
  twitter-card:
    creator: "@g_fandos"
    site: "@g_fandos"
    image: images/hero.jpg
  repo-url: https://github.com/guifandos/gfandos-website

  sidebar: false

format:
  html:
    theme:
      light: [flatly, styles/custom.scss]
    toc: false
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <meta name="theme-color" content="#f7f3ea">
        <script>
        // Language: remember the visitor's choice; on the homepage only, first visit follows the browser language
        (function () {
          var path = location.pathname.replace(/index\.html$/, "");
          var isEs = /^\/es(\/|$)/.test(path);
          var isHome = path === "/" || path === "/es/";
          var pref = null; try { pref = localStorage.getItem("gf-lang"); } catch (e) {}
          if (isHome) {
            var want = pref || (((navigator.language || "").toLowerCase().indexOf("es") === 0) ? "es" : "en");
            if (want === "es" && !isEs) { location.replace("/es/"); return; }
            if (want === "en" && isEs && pref) { location.replace("/"); return; }
          }
          document.addEventListener("DOMContentLoaded", function () {
            var links = document.querySelectorAll(".navbar a.nav-link");
            links.forEach(function (a) {
              var t = a.textContent.trim();
              if (t !== "ES" && t !== "EN") return;
              var target = isEs ? path.replace(/^\/es/, "") || "/" : "/es" + path;
              a.href = target; a.classList.add("lang-switch");
              a.addEventListener("click", function () { try { localStorage.setItem("gf-lang", isEs ? "en" : "es"); } catch (e) {} });
              var alt = document.createElement("link"); alt.rel = "alternate"; alt.hreflang = isEs ? "en" : "es"; alt.href = target;
              document.head.appendChild(alt);
            });
          });
        })();
        </script>
    grid:
      body-width: 860px
      margin-width: 220px

lang: en
